name: CI

# Test, style-preview and dependency-audit jobs are parked for now.
# They need a PDFium bootstrap step and were consuming the free Actions quota
# with 8-10 minute failing runs on three operating systems. The release gate is
# `make acceptance` locally; re-enable these jobs when CI can install PDFium and
# the flaky cross-platform cases are fixed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
