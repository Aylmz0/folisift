  <text x="650" y="34" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#42594F">SOYUT MAKİNE</text>
  <g stroke="#D8CEBD" stroke-width="0.8">
    <line x1="22" y1="48" x2="838" y2="48"/>
  </g>
  <g stroke="#5E574B" stroke-width="1.1" fill="none">
