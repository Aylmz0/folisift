    <text x="160" y="164" font-size="9" fill="#5E574B">I : Program → C</text>
    <rect x="80" y="212" width="160" height="40" fill="#F1EADB" stroke="#D8CEBD"/>
    <text x="160" y="230">Geçiş kuralları</text>
