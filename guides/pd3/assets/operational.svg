    <line x1="160" y1="252" x2="160" y2="292" marker-end="url(#arrow)"/>
    <line x1="292" y1="112" x2="510" y2="112" marker-end="url(#arrow)"/>
    <line x1="650" y1="132" x2="650" y2="172" marker-end="url(#arrow)"/>
    <line x1="650" y1="212" x2="650" y2="252" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#211E19" text-anchor="middle">
