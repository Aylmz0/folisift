<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" font-family="Inter, sans-serif">
  <rect width="520" height="270" fill="#FAF6EC"/>
  <g stroke="#8A7A63" stroke-width="0.9">
    <line x1="260" y1="48" x2="150" y2="98"/>
    <line x1="260" y1="48" x2="370" y2="98"/>
    <line x1="370" y1="98" x2="300" y2="158"/>
    <line x1="370" y1="98" x2="440" y2="158"/>
    <line x1="440" y1="158" x2="400" y2="214"/>
    <line x1="440" y1="158" x2="480" y2="214"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="232" y="28" width="56" height="30" fill="#F1EADB" stroke="#8A3E2F" stroke-width="1"/>
    <text x="260" y="49" fill="#211E19">:=</text>

    <rect x="112" y="84" width="76" height="28" fill="none" stroke="#D8CEBD" stroke-width="0.8"/>
    <text x="150" y="104" fill="#211E19">sonuc</text>

    <rect x="338" y="84" width="64" height="28" fill="#F1EADB" stroke="#42594F" stroke-width="1"/>
    <text x="370" y="104" fill="#211E19">+</text>

    <rect x="270" y="144" width="60" height="28" fill="none" stroke="#D8CEBD" stroke-width="0.8"/>
    <text x="300" y="164" fill="#211E19">a</text>

    <rect x="408" y="144" width="64" height="28" fill="#F1EADB" stroke="#42594F" stroke-width="1"/>
    <text x="440" y="164" fill="#211E19">*</text>

    <rect x="374" y="200" width="52" height="28" fill="none" stroke="#D8CEBD" stroke-width="0.8"/>
    <text x="400" y="220" fill="#211E19">b</text>

    <rect x="456" y="200" width="48" height="28" fill="none" stroke="#D8CEBD" stroke-width="0.8"/>
    <text x="480" y="220" fill="#211E19">10</text>
  </g>
  <text x="36" y="248" font-size="8.5" fill="#5E574B">sonuc = a + b * 10</text>
