  </g>
  <g stroke="#8A3E2F" stroke-width="1" marker-end="url(#sa)">
    <line x1="158" y1="87" x2="178" y2="87"/>
    <line x1="330" y1="87" x2="350" y2="87"/>
    <line x1="502" y1="87" x2="522" y2="87"/>
    <line x1="674" y1="87" x2="694" y2="87"/>
  </g>
  <path d="M 771 128 C 771 168, 83 168, 83 128" fill="none" stroke="#D8CEBD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sa)"/>
  <text x="430" y="160" text-anchor="middle" font-size="8.5" fill="#5E574B">geri besleme · bakım yeni gereksinimler doğurabilir</text>
  <text x="8" y="30" font-size="9" letter-spacing="1.2" fill="#8A3E2F">YAZILIM GELİŞTİRME YAŞAM DÖNGÜSÜ · 5 AŞAMA</text>
