<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" font-family="Inter, sans-serif">
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A3E2F"/>
    </marker>
  </defs>
  <rect width="860" height="180" fill="#FAF6EC"/>
  <g font-size="9.5" fill="#211E19">
