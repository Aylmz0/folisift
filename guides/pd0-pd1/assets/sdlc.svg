    <text x="427" y="93" text-anchor="middle">ve birim</text>
    <text x="427" y="108" text-anchor="middle">sınama</text>

    <rect x="524" y="52" width="150" height="70" fill="#F1EADB" stroke="#B08A4F" stroke-width="1"/>
    <text x="599" y="85" text-anchor="middle">Sınama</text>
