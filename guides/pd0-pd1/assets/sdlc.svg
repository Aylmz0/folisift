    <text x="83" y="93" text-anchor="middle">analizi ve</text>
    <text x="83" y="108" text-anchor="middle">belirlenmesi</text>

    <rect x="180" y="52" width="150" height="70" fill="#F1EADB" stroke="#B08A4F" stroke-width="1"/>
    <text x="255" y="85" text-anchor="middle">Sistem</text>
    <text x="255" y="100" text-anchor="middle">tasarımı</text>

    <rect x="352" y="52" width="150" height="70" fill="#F1EADB" stroke="#B08A4F" stroke-width="1"/>
