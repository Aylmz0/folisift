[package]
name = "folisift-cli"
description = "Command-line interface for the Folisift study-guide pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "folisift"
path = "src/main.rs"

[dependencies]
clap.workspace = true
folisift-core = { path = "../folisift-core", version = "0.1.0" }
folisift-parse = { path = "../folisift-parse", version = "0.1.0" }
folisift-mcp = { path = "../folisift-mcp", version = "0.1.0" }
folisift-render = { path = "../folisift-render", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
