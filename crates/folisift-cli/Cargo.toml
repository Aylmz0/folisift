[package]
name = "folisift-cli"
description = "Command-line interface for the Folisift study-guide pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "folisift"
path = "src/main.rs"

[features]
default = []
ocr-tesseract = ["folisift-parse/ocr-tesseract", "folisift-mcp/ocr-tesseract"]

[dependencies]
blake3.workspace = true
clap.workspace = true
folisift-build = { path = "../folisift-build", version = "0.23.1" }
folisift-core = { path = "../folisift-core", version = "0.23.1" }
folisift-links = { path = "../folisift-links", version = "0.23.1" }
folisift-parse = { path = "../folisift-parse", version = "0.23.1" }
folisift-mcp = { path = "../folisift-mcp", version = "0.23.1" }
folisift-render = { path = "../folisift-render", version = "0.23.1" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
