[workspace]
members = [
    "crates/folisift-core",
    "crates/folisift-parse",
    "crates/folisift-render",
    "crates/folisift-build",
    "crates/folisift-mcp",
    "crates/folisift-cli",
    "crates/folisift-links",
]
resolver = "3"

[workspace.package]
version = "0.12.4"
edition = "2024"
rust-version = "1.92"
license = "PolyForm-Strict-1.0.0"
repository = "https://github.com/Aylmz0/folisift"
publish = false

[workspace.dependencies]
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png"] }
liteparse = { version = "2.17", default-features = false }
liteparse-pdfium = "1.13"
pathdiff = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rmcp = { version = "3.7", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
bm25 = "2.3"
sha2 = "0.10"
model2vec-rs = { version = "=0.4.0", default-features = false, features = ["onig", "local-only"] }
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# crates.io citationberg 0.7.0 pins quick-xml 0.38, which has two high-severity
# parsing advisories. Upstream main has the quick-xml 0.41 bump; pin this commit
# until a fixed 0.7.x release is available.
[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "8966cf7c178b38b621d297c9eb6d0bb81e14be5e" }
