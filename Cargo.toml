[workspace]
members = [
    "crates/folisift-core",
    "crates/folisift-parse",
    "crates/folisift-render",
    "crates/folisift-mcp",
    "crates/folisift-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png"] }
liteparse = { version = "2.17", default-features = false }
liteparse-pdfium = "1.13"
pathdiff = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rmcp = { version = "3.7", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
